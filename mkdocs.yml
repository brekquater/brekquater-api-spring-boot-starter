site_name: Brekquater API Spring Boot Starter
site_description: API design warnings and a maturity score inside Swagger UI, for Spring Boot.
# Rule pages are linked from every finding as https://starter.brekquater.com/api/rules/<RULE-ID>, so this address
# and the directory layout under docs/rules must not change.
site_url: https://starter.brekquater.com/api/
repo_url: https://github.com/brekquater/brekquater-api-spring-boot-starter
repo_name: brekquater-api-spring-boot-starter
edit_uri: edit/master/docs/
copyright: Code licensed under Apache-2.0. The Brekquater name and logo are trademarks of Brekquater.

docs_dir: docs
exclude_docs: |
  /PRD.md
  /DESIGN.md
  /requirements.txt
  /root-index.html

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Configuration: configuration.md
  - Build reports: reports.md
  - Rules: rules/index.md
  - Contributing: https://github.com/brekquater/brekquater-api-spring-boot-starter/blob/master/CONTRIBUTING.md
