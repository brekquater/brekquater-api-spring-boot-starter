# The bad API also comes with bad build evidence: made-up reports that break the coverage, test and vulnerability
# rules. Paths are relative to the demo module, the working directory of ./mvnw spring-boot:run.
brekquater:
  api:
    reports:
      coverage: samples/bad/jacoco.xml
      test-results: samples/bad
      vulnerabilities: samples/bad/osv-scanner.json
      # An earlier release of the bad API. The current one breaks it in every way the BQ-EVO rules check.
      baseline: samples/bad/openapi-baseline.json

# BQ-SEC-011: the environment endpoint is exposed and springdoc lists Actuator endpoints in the document.
management:
  endpoints:
    web:
      exposure:
        include: health,env
springdoc:
  show-actuator: true
